name: Threads Reliable Scheduled Post

on:
  schedule:
    # Primary runs start shortly before each window and wait for that day's
    # stable random target. This avoids relying on many best-effort cron events.
    # Primary: 07:23 / 11:53 / 19:53 JST
    - cron: "23 22 * * *"
    - cron: "53 2 * * *"
    - cron: "53 10 * * *"
    # Recovery: shortly after each requested window.
    # 08:23 / 13:23 / 21:23 JST
    - cron: "23 23 * * *"
    - cron: "23 4 * * *"
    - cron: "23 12 * * *"
    # Final recovery before each slot's grace period closes.
    # 10:23 / 15:23 / 23:23 JST
    - cron: "23 1,6,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: threads-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh latest posting state
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify scheduler safeguards
        run: python -m unittest -v test_schedule.py

      - name: Publish next scheduled post
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python post_threads.py --scheduled --wait-until-target

      - name: Save posting position
        # Preserve a pending affiliate reply even if the reply API call fails.
        # The next scheduled run retries only the reply, never the parent post.
        if: ${{ always() }}
        run: |
          if git diff --quiet -- state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update Threads posting position"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              git fetch origin main
              if git diff --quiet origin/main -- state.json; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "投稿記録をGitHubへ保存できませんでした。"
          exit 1
