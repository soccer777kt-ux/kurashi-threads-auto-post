name: Threads Reliable Scheduled Post

on:
  schedule:
    # GitHubの取りこぼしに備え、対象時間帯は10分ごとに確認します。
    # 投稿済み判定とconcurrencyにより重複投稿は防止されます。
    # UTC hours = JST morning/lunch/night and their recovery periods.
    - cron: "7,17,27,37,47,57 0,1,3,4,5,6,11,12,13,14,22,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: threads-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh latest posting state
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify scheduler safeguards
        run: python -m unittest -v test_schedule.py

      - name: Publish next scheduled post
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python post_threads.py --scheduled

      - name: Save posting position
        if: ${{ success() }}
        run: |
          if git diff --quiet -- state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update Threads posting position"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              git fetch origin main
              if git diff --quiet origin/main -- state.json; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "投稿記録をGitHubへ保存できませんでした。"
          exit 1
