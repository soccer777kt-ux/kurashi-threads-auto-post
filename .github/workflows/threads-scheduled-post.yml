name: Threads Scheduled Post

on:
  schedule:
    # GitHub schedules are best-effort, so check repeatedly after each stable
    # random target. Off-hour minutes reduce peak-time delays. Late checks are
    # recovery fallbacks and remain duplicate-safe through state.json.
    # Morning: 07:27-08:17 JST, plus 08:37 / 09:07 / 10:07 recovery
    - cron: "27,37,47,57 22 * * *"
    - cron: "7,17,37 23 * * *"
    - cron: "7 0,1 * * *"
    # Lunch: 11:57-13:17 JST, plus 13:37 / 14:07 / 15:07 recovery
    - cron: "57 2 * * *"
    - cron: "7,17,27,37,47,57 3 * * *"
    - cron: "7,17,37 4 * * *"
    - cron: "7 5,6 * * *"
    # Night: 19:57-21:17 JST, plus 21:37 / 22:07 / 23:07 recovery
    - cron: "57 10 * * *"
    - cron: "7,17,27,37,47,57 11 * * *"
    - cron: "7,17,37 12 * * *"
    - cron: "7 13,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: threads-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh latest posting state
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify scheduler safeguards
        run: python -m unittest -v test_schedule.py

      - name: Publish next scheduled post
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python post_threads.py --scheduled

      - name: Save posting position
        if: ${{ success() }}
        run: |
          if git diff --quiet -- state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update Threads posting position"
          git push
