name: Threads Scheduled Post

on:
  schedule:
    # Start shortly before each Japan-time window. The Python script chooses a
    # stable random minute inside the hour; later entries are no-op fallbacks.
    # Lunch window 12:00-13:00 JST
    - cron: "55 2 * * *"
    - cron: "30 3 * * *"
    - cron: "55 3 * * *"
    # Night window 20:00-21:00 JST
    - cron: "55 10 * * *"
    - cron: "30 11 * * *"
    - cron: "55 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: threads-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh latest posting state
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publish next scheduled post
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python post_threads.py --scheduled

      - name: Save posting position
        if: ${{ success() }}
        run: |
          if git diff --quiet -- state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update Threads posting position"
          git push
