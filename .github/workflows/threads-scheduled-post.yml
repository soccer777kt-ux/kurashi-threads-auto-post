name: Threads Scheduled Post

on:
  schedule:
    # Japan 07:50 / fallback 08:20 (UTC, avoiding timezone-parser dependency)
    - cron: "50 22 * * *"
    - cron: "20 23 * * *"
    # Japan 10:30 / fallbacks 11:03 and 11:35
    - cron: "30 1 * * *"
    - cron: "3 2 * * *"
    - cron: "35 2 * * *"
    # Japan 12:50 / fallback 13:20
    - cron: "50 3 * * *"
    - cron: "20 4 * * *"
    # Japan 18:02 / fallback 18:32
    - cron: "2 9 * * *"
    - cron: "32 9 * * *"
    # Japan 20:40 / fallback 21:10
    - cron: "40 11 * * *"
    - cron: "10 12 * * *"
    # Daily scheduler heartbeat at Japan 23:27
    - cron: "27 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: threads-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh latest posting state
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publish next scheduled post
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python post_threads.py --scheduled

      - name: Save posting position
        if: ${{ success() }}
        run: |
          if git diff --quiet -- state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update Threads posting position"
          git push
